# Publishes the runner nutrition site (nutrition/) to the gh-pages branch,
# which GitHub Pages serves at https://harel05333-oss.github.io/-/
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["nutrition/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp -r nutrition/. _site/
          find _site -name '*.md' -delete
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
